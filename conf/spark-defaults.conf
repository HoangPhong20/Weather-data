# ==================================================
# ICEBERG EXTENSIONS
# ==================================================
spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# ==================================================
# ICEBERG CATALOG (REST)
# ==================================================
spark.sql.catalog.weather=org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.weather.type=rest
spark.sql.catalog.weather.uri=http://iceberg-rest:8181
spark.sql.catalog.weather.warehouse=s3a://weather-lake/warehouse

spark.sql.defaultCatalog=weather

# ==================================================
# JARS
# ==================================================
spark.jars.packages=org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262

# ==================================================
# S3A / MINIO
# ==================================================
spark.hadoop.fs.s3a.impl=org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint=http://minio:9000
spark.hadoop.fs.s3a.access.key=minioadmin
spark.hadoop.fs.s3a.secret.key=minioadmin
spark.hadoop.fs.s3a.path.style.access=true
spark.hadoop.fs.s3a.connection.ssl.enabled=false
spark.hadoop.fs.s3a.aws.credentials.provider=org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# ==================================================
# PERFORMANCE
# ==================================================
spark.hadoop.fs.s3a.fast.upload=true
spark.hadoop.fs.s3a.connection.maximum=100