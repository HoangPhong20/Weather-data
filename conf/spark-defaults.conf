spark.sql.extensions org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.weather org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.weather.type jdbc
spark.sql.catalog.weather.uri jdbc:postgresql://airflow-db:5432/airflow
spark.sql.catalog.weather.jdbc.user airflow
spark.sql.catalog.weather.jdbc.password airflow
spark.sql.catalog.weather.warehouse s3a://weather-lake/warehouse
spark.sql.catalog.weather.io-impl org.apache.iceberg.aws.s3.S3FileIO
spark.sql.defaultCatalog weather
spark.hadoop.fs.s3a.endpoint http://minio:9000
spark.hadoop.fs.s3a.access.key minioadmin
spark.hadoop.fs.s3a.secret.key minioadmin
spark.hadoop.fs.s3a.path.style.access true
spark.hadoop.fs.s3a.connection.ssl.enabled false
