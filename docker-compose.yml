version: "3.9"

# =====================================================
# COMMON CONFIG
# =====================================================

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.3-python3.10
  env_file:
    - .env
  environment:
    AIRFLOW_HOME: /opt/airflow
    PYTHONPATH: /opt/airflow/project
    SPARK_CONF_DIR: /opt/spark/conf
    _PIP_ADDITIONAL_REQUIREMENTS: "-r /opt/airflow/project/requirement.txt"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./weather_pipeline:/opt/airflow/project
    - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
  restart: unless-stopped
  networks:
    - lakehouse


x-spark-common: &spark-common
  image: bitnami/spark:3.5.1
  env_file:
    - .env
  environment:
    SPARK_CONF_DIR: /opt/bitnami/spark/conf
  volumes:
    - ./spark/jobs:/opt/bitnami/spark/jobs
    - ./conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf
  networks:
    - lakehouse


# =====================================================
# SERVICES
# =====================================================
services:

# ================= POSTGRES (AIRFLOW DB) =================

  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lakehouse


# ================= AIRFLOW =================

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: /bin/bash
    command: >
      -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com
      "
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully


# ================= MINIO =================

  minio:
    image: minio/minio:latest
    container_name: minio
    env_file:
      - .env
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - lakehouse

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    env_file:
      - .env
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 $$AWS_ACCESS_KEY_ID $$AWS_SECRET_ACCESS_KEY);
      do echo 'waiting minio...' && sleep 2; done;
      /usr/bin/mc mb local/weather-lake --ignore-existing;
      exit 0;
      "
    networks:
      - lakehouse


# ================= SPARK =================

  spark-master:
    <<: *spark-common
    container_name: spark-master
    environment:
      SPARK_MODE: master
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    <<: *spark-common
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2


# ================= ICEBERG REST =================

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.1
    container_name: iceberg-rest
    env_file:
      - .env
    environment:
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_WAREHOUSE: s3a://weather-lake/warehouse
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    depends_on:
      - minio
    restart: unless-stopped
    networks:
      - lakehouse


# ================= TRINO =================

  trino:
    image: trinodb/trino:453
    container_name: trino
    depends_on:
      - iceberg-rest
    ports:
      - "8090:8080"
    volumes:
      - ./trino/catalog:/etc/trino/catalog
    restart: unless-stopped
    networks:
      - lakehouse


# =====================================================
# NETWORK + VOLUMES
# =====================================================

networks:
  lakehouse:

volumes:
  minio_data:
  postgres_data: