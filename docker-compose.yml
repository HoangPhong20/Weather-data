version: "3.9"

services:

# =====================================================
# POSTGRES
# =====================================================
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    networks:
      - lakehouse


# =====================================================
# AIRFLOW COMMON TEMPLATE
# =====================================================
  x-airflow-common: &airflow-common
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: airflow-spark:latest
    env_file: .env
    environment:
      AIRFLOW_HOME: /opt/airflow
      PYTHONPATH: /opt/airflow/project
      SPARK_HOME: /opt/spark
      SPARK_CONF_DIR: /opt/spark/conf
      PATH: "/opt/spark/bin:/opt/spark/sbin:$PATH"
      _PIP_ADDITIONAL_REQUIREMENTS: "-r /opt/airflow/requirements.txt"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
      - ./requirement.txt:/opt/airflow/requirements.txt:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - lakehouse


# =====================================================
# AIRFLOW INIT (DB + ADMIN USER)
# =====================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: airflow db migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  airflow-create-user:
    <<: *airflow-common
    container_name: airflow-create-user
    command: >
      airflow users create
      --username admin
      --password admin
      --firstname Airflow
      --lastname Admin
      --role Admin
      --email admin@example.com
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: "no"


# =====================================================
# AIRFLOW WEBSERVER
# =====================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    depends_on:
      airflow-create-user:
        condition: service_completed_successfully


# =====================================================
# AIRFLOW SCHEDULER
# =====================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/airflow/project
    depends_on:
      airflow-create-user:
        condition: service_completed_successfully


# =====================================================
# SPARK MASTER
# =====================================================
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8081:8080"
    volumes:
      - ./spark:/opt/spark/app
      - spark_ivy:/home/spark/.ivy2
    networks:
      - lakehouse


# =====================================================
# SPARK WORKER
# =====================================================
  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      - spark-master
    volumes:
      - ./spark:/opt/spark/app
      - spark_ivy:/home/spark/.ivy2
    networks:
      - lakehouse


# =====================================================
# NETWORK + VOLUMES
# =====================================================
networks:
  lakehouse:

volumes:
  postgres_data:
  spark_ivy: